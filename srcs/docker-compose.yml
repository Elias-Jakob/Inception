networks:
  inception:
    driver: bridge
    name: inception

volumes:
  wordpress_website:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/wordpress/
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/mariadb/

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_password:
    file: ../secrets/wp_password.txt
  wp_password_ad:
    file: ../secrets/wp_password_ad.txt

services:
  nginx:
    build: ./requirements/nginx
    image: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_website:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress
    env_file:
      - .env
    restart: unless-stopped
  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    volumes:
      - wordpress_website:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
      - wp_password
      - wp_password_ad
    restart: unless-stopped
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - mariadb_data:/run/mysqld
    networks:
      - inception
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    restart: unless-stopped
